# Build project configuration for release
[build-system]
requires = ["setuptools>=83.0.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "weco"
authors = [{ name = "Weco AI Team", email = "contact@weco.ai" }]
description = "Production-grade autoresearch: an automated research loop that improves agent harnesses, prompts, ML models, and other performance-critical code against any metric you can measure."
readme = "README.md"
version = "0.4.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "rich",
    "textual>=0.80",
    "packaging",
    "gitingest",
    "psutil",
    "tomli>=2.2.1; python_version < '3.11'",
    "langsmith>=0.8.18",
    "jupyter>=1.1.1",
    "realtime>=2.29.0",
    "claude-agent-sdk>=0.2.121",
    # pip upgrades do not consume the monorepo lock; enforce patched versions
    # of the existing Jupyter, MCP, and gitingest runtime dependencies.
    "jupyterlab>=4.5.11",
    "notebook>=7.6.3",
    "jupyter-server>=2.21.0",
    "tornado>=6.5.9",
    "mistune>=3.3.3",
    "mcp>=1.28.1",
    "pyjwt>=2.14.0",
    "cryptography>=50.0.0",
    "starlette>=1.3.1",
    "python-dotenv>=1.2.2",
    "anyio>=4.14.2",
    "urllib3>=2.8.0",
]
keywords = ["AI", "Autoresearch", "Agent Harness", "Prompt Engineering", "Code Optimization", "Machine Learning", "Code Generation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
weco = "weco.cli:main"

[project.urls]
Homepage = "https://github.com/WecoAI/weco-cli"

[project.optional-dependencies]
langfuse = ["langfuse>=2.0.0"]
dev = ["ruff", "build", "setuptools_scm", "pytest>=9.0.3", "pytest-asyncio>=1.3.0"]

[tool.setuptools.packages.find]
include = ["weco*"]

[tool.setuptools.package-data]
"weco.integrations.langsmith.wizard" = ["*.html"]
"weco.integrations.langfuse.wizard" = ["*.html"]

[tool.setuptools_scm]

# Lint and format code
[tool.ruff]
fix = false
include = ["*.py"]
exclude = [".git"]
force-exclude = true
respect-gitignore = true
indent-width = 4
line-length = 127

[tool.ruff.lint]
ignore = ["E402"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = true
