# Check-only lint. This repository's main branch is maintained as a mirror
# of an upstream source of truth: never auto-commit or push fixes here; any
# commit made directly to main is overwritten by the next mirror sync.
# Lint failures are fixed upstream.
#
# The workflow name is load-bearing: release.yml triggers on the completion
# of "Lint and Format Code" and only releases when it succeeded.
name: Lint and Format Code

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Install dependencies
      # Pinned to the ruff version upstream CI runs, so this workflow can
      # never fail on code that upstream lints green. Bump together with
      # the upstream ruff version.
      run: |
        python -m pip install --upgrade pip
        pip install "ruff==0.11.0"

    - name: Run Linter & Formatter
      run: |
        ruff check .
        ruff format --check .
