# Check-only lint for the public satellite (WecoAI/weco-cli). This repo's
# main is a mirror of the weco-platform monorepo: never auto-commit or push
# fixes here; any commit made on the satellite is overwritten by the next
# mirror push. Lint failures are fixed in the monorepo.
#
# The workflow name is load-bearing: release.yml triggers on the completion
# of "Lint and Format Code" and only releases when it succeeded.
name: Lint and Format Code

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Install dependencies
      # Pinned to the ruff version the monorepo resolves in uv.lock, so the
      # satellite can never fail on code the monorepo lints green. Bump this
      # together with the workspace ruff version.
      run: |
        python -m pip install --upgrade pip
        pip install "ruff==0.11.0"

    - name: Run Linter & Formatter
      run: |
        ruff check .
        ruff format --check .
